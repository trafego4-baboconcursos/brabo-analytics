<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acessar Painel — Brabo Analytics</title>
  <link rel="icon" type="image/png" href="/img/favicon-brabo-concursos.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    :root {
      --primary: #2f5ee3;
      --primary-dark: #1b3fb5;
      --primary-gradient: linear-gradient(135deg, #2f5ee3 0%, #1f2937 100%);
      --bg-gradient: radial-gradient(circle at top right, #1f2330 0%, #0f1118 70%);
      --card-bg: rgba(31, 35, 48, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(15, 17, 24, 0.8);
      --text: #ffffff;
      --text-muted: #9ca3af;
      --danger: #f05454;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Elementos decorativos no background */
    .bg-glow-1 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(47, 94, 227, 0.15);
      filter: blur(80px);
      top: -100px;
      left: -100px;
      z-index: 1;
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    .bg-glow-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(118, 75, 162, 0.12);
      filter: blur(100px);
      bottom: -150px;
      right: -100px;
      z-index: 1;
      animation: floatGlow 18s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    /* Container de login */
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      position: relative;
      z-index: 10;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Card com Glassmorphism */
    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.03), transparent);
      transform: rotate(30deg);
      pointer-events: none;
    }

    /* Header do Card */
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      height: 44px;
      margin-bottom: 16px;
      filter: drop-shadow(0 2px 8px rgba(47, 94, 227, 0.3));
    }

    .login-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(120deg, #ffffff, #a3b8cc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Alerta de Erro */
    .error-alert {
      background: rgba(240, 84, 84, 0.15);
      border: 1px solid rgba(240, 84, 84, 0.3);
      color: #ff8080;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Formulário */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 16px;
      color: var(--text-muted);
      font-size: 18px;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 16px 14px 46px;
      font-family: inherit;
      font-size: 14px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(47, 94, 227, 0.15);
      background: rgba(15, 17, 24, 0.95);
    }

    .form-input:focus + i {
      color: var(--primary-2);
    }

    /* Botão */
    .btn-submit {
      width: 100%;
      background: var(--primary-gradient);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      box-shadow: 0 8px 20px rgba(47, 94, 227, 0.4);
      filter: brightness(1.1);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img class="login-logo" src="/img/logo-b-brabo-concursos.png" alt="Brabo Concursos Logo">
        <h1>Brabo Analytics</h1>
        <p>Insira suas credenciais para acessar o painel</p>
      </div>

      {% if error %}
      <div class="error-alert">
        <i class="ti ti-alert-circle"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/login" method="post">
        <!-- Manter o launch_code original se houver para redirecionar de volta -->
        {% if next_launch %}
        <input type="hidden" name="next_launch" value="{{ next_launch }}">
        {% endif %}

        {% if invited %}
        <div class="error-alert" style="background:rgba(49,193,108,.15);border-color:rgba(49,193,108,.3);color:#6ee7a0">
          <i class="ti ti-circle-check"></i>
          <span>Conta criada com sucesso! Faça login para continuar.</span>
        </div>
        {% endif %}

        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <div class="input-wrapper">
            <input class="form-input" type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email" autofocus>
            <i class="ti ti-mail"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <div class="input-wrapper">
            <input class="form-input" type="password" id="password" name="password" placeholder="Sua senha" required autocomplete="current-password">
            <i class="ti ti-lock"></i>
          </div>
        </div>

        <button class="btn-submit" type="submit">
          <span>Acessar Painel</span>
          <i class="ti ti-arrow-right"></i>
        </button>
      </form>

      <div class="footer-note">
        &copy; 2026 Brabo Concursos. Todos os direitos reservados.
      </div>
    </div>
  </div>

</body>
</html>
