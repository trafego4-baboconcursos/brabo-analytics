# Mapeamento lançamento -> release da SendFlow, usado por
# frontend/db_readers/sendflow_contagem.py pra calcular Total/Total Limpo/
# Entrada/Saída direto da API (mesmo padrão do sendflow-analytics-poller:
# número único via export-leads, admin excluído, entradas/saídas do dia
# via /analytics) — sem depender do Sheets nem da tabela acumulada.
#
# token_env = nome da variável de ambiente que guarda o token Bearer da
# SendFlow (o valor em si fica só no .env/EasyPanel, nunca aqui — mesmo
# padrão do resto do projeto, ver config/whatsapp_accounts.yaml). É um único
# token pra todos os lançamentos (SENDFLOW_API_TOKEN), confirmado com o
# usuário em 2026-09-01.
# release_id = SENDFLOW_RELEASE_ID do app correspondente no EasyPanel

