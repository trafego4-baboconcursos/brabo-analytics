name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Dummies: o CI não tem banco — os testes de fumaça (marker "smoke")
      # ficam de fora; rodam localmente contra o .env real.
      SECRET_KEY: ci-secret-key
      BRABO_USER: ci@teste.local
      BRABO_PASS: ci-senha
      SUPABASE_DB_URL: postgresql://ci:ci@127.0.0.1:1/ci
      SUPABASE_USERS_URL: postgresql://ci:ci@127.0.0.1:1/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: Testes (unitários + compilação de templates)
        run: python -m pytest -m "not smoke" -q
