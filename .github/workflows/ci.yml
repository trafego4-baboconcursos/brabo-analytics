name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Dummies: o CI não tem banco — os testes de fumaça (marker "smoke")
      # ficam de fora; rodam localmente contra o .env real.
      SECRET_KEY: ci-secret-key
      BRABO_USER: ci@teste.local
      BRABO_PASS: ci-senha
      SUPABASE_DB_URL: postgresql://ci:ci@127.0.0.1:1/ci
      SUPABASE_USERS_URL: postgresql://ci:ci@127.0.0.1:1/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # MESMA versão do container (Dockerfile: python:3.10-slim). O CI rodava
          # 3.12 e o dev roda 3.14 — três versões diferentes, e a de produção não
          # era testada por ninguém. Em 18/09/26 isso derrubou o scheduler: a
          # anotação `threading.Lock | None` é avaliada na definição da função no
          # 3.10 (TypeError, porque Lock é fábrica e não classe), mas é preguiçosa
          # no 3.14 — passou nos testes locais e quebrou em produção.
          # Ao trocar a versão do Dockerfile, trocar aqui junto.
          python-version: "3.10"
          cache: pip

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: Testes (unitários + compilação de templates)
        # "visual" também fica de fora: precisa de banco E do Chromium do
        # Playwright (~150 MB), que não vale instalar no CI só pra ele pular
        # sozinho no login. Roda localmente — ver ARQUITETURA, seção Testes.
        run: python -m pytest -m "not smoke and not visual" -q
