name: BV-26 - Verba cheia da Captacao (diario, 00h05)

# Todo dia as 00h05 (Brasilia) aplica os planos config/orcamentos/BV-26-*.json cujo "aplicar_em" e o dia de hoje.
# Para subir a verba cheia de campanhas ativadas "proporcional" no dia D, crie um plano com aplicar_em = D+1
# (ver BV-26-captacao-v2.json como modelo), commite E faca push na main antes da meia-noite.
# Plano de outro dia = o script sai sem fazer nada. Falha de qualquer campanha => job VERMELHO (codigo 1).

on:
  schedule:
    # 00:05 America/Sao_Paulo (UTC-3) = 03:05 UTC, todo dia. O GitHub pode atrasar alguns minutos.
    - cron: "5 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Somente ler e comparar (nao grava)"
        type: boolean
        default: true
      forcar:
        description: "Aplicar mesmo fora da data do plano"
        type: boolean
        default: false

jobs:
  aplicar-verba:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Aplicar verba cheia (todos os planos BV-26 do dia)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          # No agendamento (cron) os inputs vem vazios: dry-run so quando pedido explicitamente.
          DRY: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          FORCAR: ${{ github.event.inputs.forcar == 'true' && '--forcar' || '' }}
        run: |
          rc=0
          for f in config/orcamentos/BV-26-*.json; do
            echo "=== $f"
            python -m scripts.ajustar_verba_lista --arquivo "$f" $DRY $FORCAR || rc=1
          done
          exit $rc
